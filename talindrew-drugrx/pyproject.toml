[project]
name = "drugrx"
version = "0.1.0"
description = "Small models for in-silico candidate triage, trained on Colab L4s and served into FoldRx."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "rdkit",
    "scikit-learn",
    "scipy",
    "lightgbm",
    "datasets",
    "huggingface_hub",
    "pyarrow",
]

[project.optional-dependencies]
# Not installed on the laptop: the laptop featurises, the L4 trains.
train = ["torch", "transformers"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["drugrx*"]
